[package]
name = "termgammon"
version = "0.0.0-dev"
edition = "2024"
description = "Backgammon in the terminal, with an AI, a doubling cube, themes and animations"
license = "MIT"
authors = ["Mani Ebrahimi <mani.ebra@gmail.com>"]
repository = "https://github.com/maniebra/termgammon"
readme = "README.md"
keywords = ["backgammon", "game", "tui", "terminal", "ratatui"]
categories = ["games", "command-line-utilities"]
exclude = [".github"]

[dependencies]
ratatui = "0.30.2"

[package.metadata.deb]
section = "games"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/termgammon", dest = "/usr/bin/termgammon", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/termgammon/README.md", doc = true, mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/termgammon/LICENSE", mode = "644" },
]
